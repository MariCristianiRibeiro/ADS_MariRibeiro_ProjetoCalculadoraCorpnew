<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>ProjectCalcCorp - Gestão de Colaboradores</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background-color: #007bff; color: white; padding: 12px 20px; border-radius: 6px; margin-bottom: 20px; }
        .nav-link { color: white; text-decoration: none; font-weight: bold; margin-right: 15px; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</h:head>
<h:body>

    <!-- Barra Superior -->
    <div class="header-bar">
        <div>
            <h2 style="margin:0; display:inline-block; margin-right: 25px;">ProjectCalcCorp</h2>
            <h:outputLink value="agendamento.xhtml" styleClass="nav-link">Agendamentos</h:outputLink>
            <h:outputLink value="sala.xhtml" styleClass="nav-link">Salas</h:outputLink>
            <h:outputLink value="colaborador.xhtml" styleClass="nav-link" style="text-decoration: underline;">Colaboradores</h:outputLink>
        </div>
        <div>
            <h:outputText value="Bem-vindo, #{usuarioLogado.nome}!" style="font-weight: bold; margin-right: 15px;" />
            <h:form style="display:inline;">
                <p:commandButton value="Sair" action="#{loginBean.autenticar}" ajax="false" styleClass="ui-button-danger ui-button-flat" />
            </h:form>
        </div>
    </div>

    <!-- Tabela de Colaboradores -->
    <h:form id="formColab">
        <p:growl id="messages" showDetail="true" />

        <p:panel header="Gestão de Colaboradores &amp; Custo/Hora">
            <p:toolbar style="margin-bottom: 15px;">
                <p:toolbarGroup>
                    <p:commandButton value="Novo Colaborador" icon="pi pi-user-plus" 
                                     actionListener="#{colaboradorBean.prepararNovo}" 
                                     oncomplete="PF('dlgColab').show()" 
                                     update=":formColabDialog:pgColab" 
                                     styleClass="ui-button-success" style="margin-right: 10px;" />
                    <p:commandButton value="Atualizar Lista" icon="pi pi-refresh" 
                                     actionListener="#{colaboradorBean.carregarColaboradores}" 
                                     update="formColab:dtColaboradores" 
                                     styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable id="dtColaboradores" var="c" value="#{colaboradorBean.colaboradores}" 
                         emptyMessage="Nenhum colaborador encontrado." paginator="true" rows="10">

                <p:column headerText="ID" style="width: 50px; text-align: center;">
                    <h:outputText value="#{c.id}" />
                </p:column>

                <p:column headerText="Nome">
                    <h:outputText value="#{c.nome}" />
                </p:column>

                <p:column headerText="Matrícula" style="width: 120px;">
                    <h:outputText value="#{c.matricula}" />
                </p:column>

                <p:column headerText="Cargo">
                    <h:outputText value="#{c.cargo}" />
                </p:column>

                <p:column headerText="Valor / Hora" style="width: 130px; text-align: right;">
                    <h:outputText value="#{c.valorHora}" style="font-weight: bold; color: #1565c0;">
                        <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Ações" style="width: 90px; text-align: center;">
                    <p:commandButton icon="pi pi-pencil" title="Editar Valor/Hora"
                                     actionListener="#{colaboradorBean.prepararEdicao(c)}"
                                     oncomplete="PF('dlgColab').show()"
                                     update=":formColabDialog:pgColab"
                                     styleClass="ui-button-warning ui-button-sm" />
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:form>

    <!-- Modal Editar/Cadastrar Colaborador -->
    <p:dialog header="Cadastro de Colaborador" widgetVar="dlgColab" modal="true" resizable="false" width="450">
        <h:form id="formColabDialog">
            <h:panelGrid id="pgColab" columns="2" cellpadding="5" style="width:100%;">

                <p:outputLabel for="nome" value="Nome:" />
                <p:inputText id="nome" value="#{colaboradorBean.colaboradorSelecionado.nome}" required="true" style="width:100%;" />

                <p:outputLabel for="matricula" value="Matrícula:" />
                <p:inputText id="matricula" value="#{colaboradorBean.colaboradorSelecionado.matricula}" required="true" style="width:100%;" />

                <p:outputLabel for="email" value="E-mail:" />
                <p:inputText id="email" value="#{colaboradorBean.colaboradorSelecionado.email}" required="true" style="width:100%;" />

                <p:outputLabel for="cargo" value="Cargo:" />
                <p:inputText id="cargo" value="#{colaboradorBean.colaboradorSelecionado.cargo}" required="true" style="width:100%;" />

                <p:outputLabel for="valorHora" value="Valor / Hora (R$):" />
                <p:inputNumber id="valorHora" value="#{colaboradorBean.colaboradorSelecionado.valorHora}" decimalPlaces="2" required="true" style="width:100%;" />

            </h:panelGrid>

            <div style="text-align: right; margin-top: 15px;">
                <p:commandButton value="Salvar" icon="pi pi-check" 
                                 actionListener="#{colaboradorBean.salvar}" 
                                 update=":formColab:dtColaboradores :formColab:messages" 
                                 oncomplete="if (!args.validationFailed) PF('dlgColab').hide()" />
                <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('dlgColab').hide()" 
                                 type="button" styleClass="ui-button-flat" style="margin-left:5px;" />
            </div>
        </h:form>
    </p:dialog>

</h:body>
</html>
