<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>ProjectCalcCorp - Gestão de Salas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background-color: #007bff; color: white; padding: 12px 20px; border-radius: 6px; margin-bottom: 20px; }
        .nav-link { color: white; text-decoration: none; font-weight: bold; margin-right: 15px; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</h:head>
<h:body>

    <!-- Barra Superior / Navegação -->
    <div class="header-bar">
        <div>
            <h2 style="margin:0; display:inline-block; margin-right: 25px;">ProjectCalcCorp</h2>
            <h:outputLink value="agendamento.xhtml" styleClass="nav-link">Agendamentos</h:outputLink>
            <h:outputLink value="sala.xhtml" styleClass="nav-link" style="text-decoration: underline;">Salas</h:outputLink>
            <h:outputLink value="colaborador.xhtml" styleClass="nav-link">Colaboradores</h:outputLink>
            <h:outputLink value="recurso.xhtml" styleClass="nav-link">Recursos</h:outputLink>
        </div>
        <h:panelGroup>
            <h:outputText value="Bem-vindo, #{usuarioLogado.nome}!" style="font-weight: bold; margin-right: 15px;" />
            <h:form style="display:inline;">
                <p:commandButton value="Sair" action="#{loginBean.autenticar}" ajax="false" styleClass="ui-button-danger ui-button-flat" />
            </h:form>
        </h:panelGroup>
    </div>

    <!-- Tabela Principal de Salas -->
    <h:form id="formSala">
        <p:growl id="messages" showDetail="true" />

        <p:panel header="Gestão de Salas de Reunião &amp; Valor/Hora">
            <p:toolbar style="margin-bottom: 15px;">
                <p:toolbarGroup>
                    <p:commandButton value="Nova Sala" icon="pi pi-plus" 
                                     actionListener="#{salaBean.prepararNovaSala}" 
                                     oncomplete="PF('dlgSala').show()" 
                                     update=":formSalaDialog:pgSala" 
                                     styleClass="ui-button-success" style="margin-right: 10px;" />
                    <p:commandButton value="Atualizar Lista" icon="pi pi-refresh" 
                                     actionListener="#{salaBean.carregarSalas}" 
                                     update="formSala:dtSalas" 
                                     styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable id="dtSalas" var="s" value="#{salaBean.salas}" 
                         emptyMessage="Nenhuma sala registrada no banco de dados." 
                         paginator="true" rows="10">

                <p:column headerText="ID" style="width: 60px; text-align:center;">
                    <h:outputText value="#{s.id}" />
                </p:column>

                <p:column headerText="Nome da Sala">
                    <h:outputText value="#{s.nome}" style="font-weight: bold;" />
                </p:column>

                <p:column headerText="Andar" style="width: 100px; text-align:center;">
                    <h:outputText value="#{s.andar}" />
                </p:column>

                <p:column headerText="Capacidade Máxima" style="width: 160px; text-align:center;">
                    <h:outputText value="#{s.capacidadeMaxima} pessoas" />
                </p:column>

                <p:column headerText="Valor / Hora" style="width: 150px; text-align:right;">
                    <h:outputText value="#{s.valorHora}" style="font-weight: bold; color: #2e7d32;">
                        <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Ações" style="width: 140px; text-align:center;">
                    <p:commandButton icon="pi pi-pencil" title="Editar"
                                     actionListener="#{salaBean.prepararEdicao(s)}"
                                     oncomplete="PF('dlgSala').show()"
                                     update=":formSalaDialog:pgSala"
                                     styleClass="ui-button-warning ui-button-sm" style="margin-right: 5px;" />
                    
                    <p:commandButton icon="pi pi-trash" title="Excluir"
                                     actionListener="#{salaBean.excluir(s)}"
                                     update=":formSala:dtSalas :formSala:messages"
                                     styleClass="ui-button-danger ui-button-sm">
                        <p:confirm header="Confirmação" message="Tem certeza que deseja excluir esta sala?" icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:form>

    <!-- Diálogo de Confirmação -->
    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
        <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
        <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" />
    </p:confirmDialog>

    <!-- Modal Cadastro / Edição -->
    <p:dialog header="Dados da Sala de Reunião" widgetVar="dlgSala" modal="true" resizable="false" width="450">
        <h:form id="formSalaDialog">
            <h:panelGrid id="pgSala" columns="2" cellpadding="5" style="width:100%;">

                <p:outputLabel for="nome" value="Nome da Sala:" />
                <p:inputText id="nome" value="#{salaBean.salaSelecionada.nome}" required="true" style="width:100%;" />

                <p:outputLabel for="andar" value="Andar:" />
                <p:inputNumber id="andar" value="#{salaBean.salaSelecionada.andar}" decimalPlaces="0" required="true" style="width:100%;" />

                <p:outputLabel for="capacidade" value="Capacidade Máxima:" />
                <p:inputNumber id="capacidade" value="#{salaBean.salaSelecionada.capacidadeMaxima}" decimalPlaces="0" required="true" style="width:100%;" />

                <p:outputLabel for="valorHora" value="Valor por Hora (R$):" />
                <p:inputNumber id="valorHora" value="#{salaBean.salaSelecionada.valorHora}" decimalPlaces="2" required="true" style="width:100%;" />

            </h:panelGrid>

            <div style="text-align: right; margin-top: 15px;">
                <p:commandButton value="Salvar" icon="pi pi-check" 
                                 actionListener="#{salaBean.salvar}" 
                                 update=":formSala:dtSalas :formSala:messages pgSala" 
                                 oncomplete="if (!args.validationFailed) PF('dlgSala').hide()" />
                <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('dlgSala').hide()" 
                                 type="button" styleClass="ui-button-flat" style="margin-left:5px;" />
            </div>
        </h:form>
    </p:dialog>

</h:body>
</html>
