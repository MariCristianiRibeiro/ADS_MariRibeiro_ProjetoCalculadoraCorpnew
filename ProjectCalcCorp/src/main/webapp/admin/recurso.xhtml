<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>ProjectCalcCorp - Recursos Tecnológicos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background-color: #007bff; color: white; padding: 12px 20px; border-radius: 6px; margin-bottom: 20px; }
        .nav-link { color: white; text-decoration: none; font-weight: bold; margin-right: 15px; }
        .nav-link:hover { text-decoration: underline; }
    </style>
</h:head>
<h:body>

    <!-- Barra de Navegação -->
    <div class="header-bar">
        <div>
            <h2 style="margin:0; display:inline-block; margin-right: 25px;">ProjectCalcCorp</h2>
            <h:outputLink value="agendamento.xhtml" styleClass="nav-link">Agendamentos</h:outputLink>
            <h:outputLink value="sala.xhtml" styleClass="nav-link">Salas</h:outputLink>
            <h:outputLink value="colaborador.xhtml" styleClass="nav-link">Colaboradores</h:outputLink>
            <h:outputLink value="recurso.xhtml" styleClass="nav-link" style="text-decoration: underline;">Recursos</h:outputLink>
        </div>
        <div>
            <h:outputText value="Bem-vindo, #{usuarioLogado.nome}!" style="font-weight: bold; margin-right: 15px;" />
            <h:form style="display:inline;">
                <p:commandButton value="Sair" action="#{loginBean.autenticar}" ajax="false" styleClass="ui-button-danger ui-button-flat" />
            </h:form>
        </div>
    </div>

    <!-- Tabela Principal de Recursos -->
    <h:form id="formRecurso">
        <p:growl id="messages" showDetail="true" />

        <p:panel header="Gestão de Recursos Tecnológicos">
            <p:toolbar style="margin-bottom: 15px;">
                <p:toolbarGroup>
                    <p:commandButton value="Novo Recurso" icon="pi pi-plus" 
                                     actionListener="#{recursoTecnologicoBean.novo}" 
                                     oncomplete="PF('dlgRecurso').show()" 
                                     update=":formRecursoDialog:pgRecurso" 
                                     styleClass="ui-button-success" style="margin-right: 10px;" />
                    <p:commandButton value="Atualizar Lista" icon="pi pi-refresh" 
                                     actionListener="#{recursoTecnologicoBean.carregarLista}" 
                                     update="formRecurso:dtRecursos" 
                                     styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <p:dataTable id="dtRecursos" var="r" value="#{recursoTecnologicoBean.lista}" 
                         emptyMessage="Nenhum recurso cadastrado no banco de dados." paginator="true" rows="10">

                <p:column headerText="ID" style="width: 60px; text-align: center;">
                    <h:outputText value="#{r.id}" />
                </p:column>

                <p:column headerText="Nome do Recurso" style="width: 250px;">
                    <h:outputText value="#{r.nome}" style="font-weight: bold;" />
                </p:column>

                <p:column headerText="Descrição">
                    <h:outputText value="#{r.descricao}" />
                </p:column>

                <p:column headerText="Ações" style="width: 120px; text-align: center;">
                    <p:commandButton icon="pi pi-pencil" title="Editar"
                                     actionListener="#{recursoTecnologicoBean.prepararEdicao(r)}"
                                     oncomplete="PF('dlgRecurso').show()"
                                     update=":formRecursoDialog:pgRecurso"
                                     styleClass="ui-button-warning ui-button-sm" style="margin-right: 5px;" />
                    
                    <p:commandButton icon="pi pi-trash" title="Excluir"
                                     actionListener="#{recursoTecnologicoBean.excluir(r)}"
                                     update=":formRecurso:dtRecursos :formRecurso:messages"
                                     styleClass="ui-button-danger ui-button-sm">
                        <p:confirm header="Confirmação" message="Tem certeza que deseja excluir este recurso?" icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:form>

    <!-- Diálogo de Confirmação -->
    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
        <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
        <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" />
    </p:confirmDialog>

    <!-- Modal Cadastro/Edição -->
    <p:dialog header="Cadastro de Recurso Tecnológico" widgetVar="dlgRecurso" modal="true" resizable="false" width="450">
        <h:form id="formRecursoDialog">
            <h:panelGrid id="pgRecurso" columns="2" cellpadding="5" style="width:100%;">

                <p:outputLabel for="nome" value="Nome do Recurso:" />
                <p:inputText id="nome" value="#{recursoTecnologicoBean.entidade.nome}" required="true" style="width:100%;" />

                <p:outputLabel for="descricao" value="Descrição:" />
                <p:inputTextarea id="descricao" value="#{recursoTecnologicoBean.entidade.descricao}" rows="3" style="width:100%;" />

            </h:panelGrid>

            <div style="text-align: right; margin-top: 15px;">
                <p:commandButton value="Salvar" icon="pi pi-check" 
                                 actionListener="#{recursoTecnologicoBean.salvar}" 
                                 update=":formRecurso:dtRecursos :formRecurso:messages" 
                                 oncomplete="if (!args.validationFailed) PF('dlgRecurso').hide()" />
                <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('dlgRecurso').hide()" 
                                 type="button" styleClass="ui-button-flat" style="margin-left:5px;" />
            </div>
        </h:form>
    </p:dialog>

</h:body>
</html>
