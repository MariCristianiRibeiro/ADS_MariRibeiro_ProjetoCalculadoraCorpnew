<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>ProjectCalcCorp - Gestão de Agendamentos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-right: 15px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</h:head>
<h:body>

    <!-- Barra Superior / Menu de Navegação -->
    <div class="header-bar">
        <div>
            <h2 style="margin:0; display:inline-block; margin-right: 25px;">ProjectCalcCorp</h2>
            <h:outputLink value="agendamento.xhtml" styleClass="nav-link" style="text-decoration: underline;">Agendamentos</h:outputLink>
            <h:outputLink value="sala.xhtml" styleClass="nav-link">Salas</h:outputLink>
            <h:outputLink value="colaborador.xhtml" styleClass="nav-link">Colaboradores</h:outputLink>
        </div>
        <h:panelGroup>
            <h:outputText value="Bem-vindo, #{usuarioLogado.nome}!" style="font-weight: bold; margin-right: 15px;" />
            <h:form style="display:inline;">
                <p:commandButton value="Sair" action="#{loginBean.autenticar}" ajax="false" styleClass="ui-button-danger ui-button-flat" />
            </h:form>
        </h:panelGroup>
    </div>

    <!-- Conteúdo Principal -->
    <h:form id="formAgendamento">
        <p:growl id="messages" showDetail="true" />

        <p:panel header="Painel de Agendamentos &amp; Calculadora de Custos Corporativos">
            <p:toolbar style="margin-bottom: 15px;">
                <p:toolbarGroup>
                    <p:commandButton value="Novo Agendamento" icon="pi pi-plus" 
                                     actionListener="#{agendamentoBean.prepararNovoAgendamento}" 
                                     oncomplete="PF('dlgNovo').show()" 
                                     update=":formNovoDialog:pgNovo :formNovoDialog:pnlAlerta" 
                                     styleClass="ui-button-success" style="margin-right: 10px;" />
                    <p:commandButton value="Atualizar Lista" icon="pi pi-refresh" 
                                     actionListener="#{agendamentoBean.carregarDados}" 
                                     update="formAgendamento:dtAgendamentos" 
                                     styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <!-- Tabela Conectada à Base de Dados PostgreSQL -->
            <p:dataTable id="dtAgendamentos" var="a" value="#{agendamentoBean.agendamentos}" 
                         emptyMessage="Nenhum agendamento encontrado no banco de dados." 
                         paginator="true" rows="10">

                <p:column headerText="ID" style="width: 50px; text-align: center;">
                    <h:outputText value="#{a.id}" />
                </p:column>

                <p:column headerText="Solicitante">
                    <h:outputText value="#{a.solicitante.nome}" />
                </p:column>

                <p:column headerText="Sala">
                    <h:outputText value="#{a.sala.nome} (Andar #{a.sala.andar})" />
                </p:column>

                <p:column headerText="Participantes" style="text-align: center;">
                    <h:outputText value="#{a.participantes.size()} presente(s)" />
                </p:column>

                <p:column headerText="Início">
                    <h:outputText value="#{a.dataHoraInicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Sao_Paulo" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Duração (h)" style="width: 90px; text-align: center;">
                    <h:outputText value="#{a.duracaoHoras}" />
                </p:column>

                <p:column headerText="Custo Total" style="width: 130px; text-align: right;">
                    <h:outputText value="#{a.custoTotal}" style="font-weight: bold; color: #{a.custoTotal.doubleValue() > 500 ? '#d32f2f' : '#2e7d32'};">
                        <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Tipo" style="width: 100px; text-align: center;">
                    <h:outputText value="#{a.tipo}" />
                </p:column>

                <p:column headerText="Status" style="width: 110px; text-align: center;">
                    <h:outputText value="#{a.status}" />
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:form>

    <!-- Modal para Criar Novo Agendamento -->
    <p:dialog header="Calculadora de Custo de Reunião" widgetVar="dlgNovo" modal="true" resizable="false" width="550">
        <h:form id="formNovoDialog">
            <h:panelGrid id="pgNovo" columns="2" cellpadding="5" style="width:100%;">

                <p:outputLabel for="sala" value="Sala de Reunião:" />
                <p:selectOneMenu id="sala" value="#{agendamentoBean.idSalaSelecionada}" required="true" style="width:100%;">
                    <f:selectItem itemLabel="Selecione a Sala..." itemValue="" />
                    <f:selectItems value="#{agendamentoBean.salas}" var="s" 
                                   itemLabel="#{s.nome} (R$ #{s.valorHora}/h)" itemValue="#{s.id}" />
                    <p:ajax listener="#{agendamentoBean.calcularCustoTotal}" update="txtCusto pnlAlerta" />
                </p:selectOneMenu>

                <p:outputLabel for="participantes" value="Participantes Presentes:" />
                <p:selectCheckboxMenu id="participantes" value="#{agendamentoBean.idsParticipantesSelecionados}" 
                                      label="Selecione os Colaboradores" style="width:100%;" filter="true" filterMatchMode="startsWith">
                    <f:selectItems value="#{agendamentoBean.colaboradoresDisponiveis}" var="c" 
                                   itemLabel="#{c.nome} (#{c.cargo} - R$ #{c.valorHora}/h)" itemValue="#{c.id}" />
                    <p:ajax listener="#{agendamentoBean.calcularCustoTotal}" update="txtCusto pnlAlerta" />
                    <p:ajax event="toggleSelect" listener="#{agendamentoBean.calcularCustoTotal}" update="txtCusto pnlAlerta" />
                </p:selectCheckboxMenu>

                <p:outputLabel for="dataInicio" value="Data e Hora Início:" />
                <p:datePicker id="dataInicio" value="#{agendamentoBean.novoAgendamento.dataHoraInicio}" 
                              showTime="true" pattern="dd/MM/yyyy HH:mm" required="true" style="width:100%;" />

                <p:outputLabel for="duracao" value="Duração (Horas):" />
                <p:inputNumber id="duracao" value="#{agendamentoBean.novoAgendamento.duracaoHoras}" 
                               minValue="0.5" decimalPlaces="1" required="true" style="width:100%;">
                    <p:ajax event="blur" listener="#{agendamentoBean.calcularCustoTotal}" update="txtCusto pnlAlerta" />
                </p:inputNumber>

                <p:outputLabel for="tipo" value="Tipo de Reunião:" />
                <p:selectOneMenu id="tipo" value="#{agendamentoBean.novoAgendamento.tipo}" style="width:100%;">
                    <f:selectItems value="#{agendamentoBean.tiposReuniao}" var="t" itemLabel="#{t.descricao}" itemValue="#{t}" />
                </p:selectOneMenu>

                <p:outputLabel value="Custo Total Estimado:" />
                <h:outputText id="txtCusto" value="#{agendamentoBean.novoAgendamento.custoTotal}" style="font-weight:bold; color:#1b5e20; font-size: 1.3em;">
                    <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
                </h:outputText>

            </h:panelGrid>

            <!-- Banner Alerta: Poderia ser um e-mail? -->
            <h:panelGroup id="pnlAlerta" layout="block" style="margin-top: 15px;">
                <h:panelGroup rendered="#{agendamentoBean.alertaEmail}" layout="block" 
                              style="background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 12px; border-radius: 6px; text-align: center;">
                    <i class="pi pi-exclamation-triangle" style="font-size: 1.4em; vertical-align: middle; margin-right: 5px; color: #d97706;"></i>
                    <strong style="font-size: 1.05em;">Atenção ao Custo Elevado!</strong><br/>
                    <span>Esta reunião custará mais de <strong>R$ 500,00</strong>.</span><br/>
                    <em style="display:inline-block; margin-top:4px; font-weight: 500; color: #b45309;">
                        "Será que este assunto não poderia ser resolvido por um e-mail?"
                    </em>
                </h:panelGroup>
            </h:panelGroup>

            <div style="text-align: right; margin-top: 20px;">
                <p:commandButton value="Confirmar Agendamento" icon="pi pi-check" 
                                 actionListener="#{agendamentoBean.salvar}" 
                                 update=":formAgendamento:dtAgendamentos :formAgendamento:messages pgNovo" 
                                 oncomplete="if (!args.validationFailed) PF('dlgNovo').hide()" />
                <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('dlgNovo').hide()" 
                                 type="button" styleClass="ui-button-flat" style="margin-left:5px;" />
            </div>
        </h:form>
    </p:dialog>

</h:body>
</html>
