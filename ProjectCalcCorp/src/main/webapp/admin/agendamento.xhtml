<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Painel Administrativo - Agendamentos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</h:head>
<h:body>

    <!-- Barra Superior / Menu de Boas-vindas -->
    <div class="header-bar">
        <h2>ProjectCalcCorp - Gestão de Agendamentos</h2>
        <h:panelGroup>
            <h:outputText value="Bem-vindo, #{usuarioLogado.nome}!" style="font-weight: bold; margin-right: 15px;" />
            <h:form style="display:inline;">
                <p:commandButton value="Sair" action="#{loginBean.autenticar}" ajax="false" styleClass="ui-button-danger ui-button-flat" />
            </h:form>
        </h:panelGroup>
    </div>

    <!-- Conteúdo Principal -->
    <h:form id="formAgendamento">
        <p:growl id="messages" showDetail="true" />

        <p:panel header="Painel de Agendamentos de Reunião">
            <p:toolbar style="margin-bottom: 15px;">
                <p:toolbarGroup>
                    <p:commandButton value="Novo Agendamento" icon="pi pi-plus" styleClass="ui-button-success" style="margin-right: 10px;" />
                    <p:commandButton value="Atualizar Lista" icon="pi pi-refresh" styleClass="ui-button-secondary" />
                </p:toolbarGroup>
            </p:toolbar>

            <!-- Tabela Exemplo Pronta para Apresentação -->
            <p:dataTable var="agendamento" value="#{agendamentoBean.agendamentos}" emptyMessage="Nenhum agendamento encontrado no momento.">
                <p:column headerText="ID" style="width: 50px;">
                    <h:outputText value="1" />
                </p:column>

                <p:column headerText="Assunto">
                    <h:outputText value="Reunião de Alinhamento de Projeto" />
                </p:column>

                <p:column headerText="Solicitante">
                    <h:outputText value="#{usuarioLogado.nome}" />
                </p:column>

                <p:column headerText="Ações" style="width: 150px; text-align: center;">
                    <p:commandButton icon="pi pi-pencil" styleClass="ui-button-warning ui-button-sm" style="margin-right: 5px;" />
                    <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger ui-button-sm" />
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:form>

</h:body>
</html>
