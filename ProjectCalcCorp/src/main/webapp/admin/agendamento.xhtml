<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Painel Administrativo - Agendamentos</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f9;
                margin: 0;
                padding: 20px;
            }
            .header-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #007bff;
                color: white;
                padding: 12px 20px;
                border-radius: 6px;
                margin-bottom: 20px;
            }
        </style>
    </h:head>
    <h:body>

        <!-- Barra Superior / Menu de Boas-vindas -->
        <div class="header-bar">
            <h2 style="margin: 0;">ProjectCalcCorp - Gestão de Agendamentos</h2>
            <h:panelGroup>
                <h:outputText value="Bem-vindo, #{usuarioLogado.nome}!" style="font-weight: bold; margin-right: 15px;" />
                <h:form style="display:inline;">
                    <p:commandButton value="Sair" action="#{loginBean.autenticar}" ajax="false" styleClass="ui-button-danger ui-button-flat" />
                </h:form>
            </h:panelGroup>
        </div>

        <!-- Conteúdo Principal -->
        <h:form id="formAgendamento">
            <p:growl id="messages" showDetail="true" />

            <p:panel header="Painel de Agendamentos de Reunião">
                <p:toolbar style="margin-bottom: 15px;">
                    <p:toolbarGroup>
                        <p:commandButton value="Novo Agendamento" icon="pi pi-plus" 
                                         actionListener="#{agendamentoBean.prepararNovoAgendamento}" 
                                         oncomplete="PF('dlgNovo').show()" 
                                         update=":formNovoDialog:pgNovo" 
                                         styleClass="ui-button-success" style="margin-right: 10px;" />
                        <p:commandButton value="Atualizar Lista" icon="pi pi-refresh" 
                                         actionListener="#{agendamentoBean.carregarDados}" 
                                         update="formAgendamento:dtAgendamentos" 
                                         styleClass="ui-button-secondary" />
                    </p:toolbarGroup>
                </p:toolbar>

                <!-- Tabela Conectada à Base de Dados PostgreSQL -->
                <p:dataTable id="dtAgendamentos" var="a" value="#{agendamentoBean.agendamentos}" 
                             emptyMessage="Nenhum agendamento encontrado no banco de dados." 
                             paginator="true" rows="10">

                    <p:column headerText="ID" style="width: 50px; text-align: center;">
                        <h:outputText value="#{a.id}" />
                    </p:column>

                    <p:column headerText="Solicitante">
                        <h:outputText value="#{a.solicitante.nome}" />
                    </p:column>

                    <p:column headerText="Sala">
                        <h:outputText value="#{a.sala.nome} (Andar #{a.sala.andar})" />
                    </p:column>

                    <p:column headerText="Início">
                        <h:outputText value="#{a.dataHoraInicio}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Sao_Paulo" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Duração (h)" style="width: 100px; text-align: center;">
                        <h:outputText value="#{a.duracaoHoras}" />
                    </p:column>

                    <p:column headerText="Custo Total" style="width: 120px; text-align: right;">
                        <h:outputText value="#{a.custoTotal}">
                            <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Tipo" style="width: 110px; text-align: center;">
                        <h:outputText value="#{a.tipo}" />
                    </p:column>

                    <p:column headerText="Status" style="width: 120px; text-align: center;">
                        <h:outputText value="#{a.status}" />
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>

        <!-- Modal para Criar Novo Agendamento -->
        <p:dialog header="Criar Novo Agendamento" widgetVar="dlgNovo" modal="true" resizable="false" width="480">
            <h:form id="formNovoDialog">
                <h:panelGrid id="pgNovo" columns="2" cellpadding="5" style="width:100%;">

                    <p:outputLabel for="sala" value="Sala de Reunião:" />
                    <p:selectOneMenu id="sala" value="#{agendamentoBean.idSalaSelecionada}" required="true" style="width:100%;">
                        <f:selectItem itemLabel="Selecione a Sala..." itemValue="" />
                        <f:selectItems value="#{agendamentoBean.salas}" var="s" 
                                       itemLabel="#{s.nome} (R$ #{s.valorHora}/h)" itemValue="#{s.id}" />
                        <p:ajax listener="#{agendamentoBean.calcularCustoTotal}" update="txtCusto" />
                    </p:selectOneMenu>

                    <p:outputLabel for="dataInicio" value="Data e Hora Início:" />
                    <p:datePicker id="dataInicio" value="#{agendamentoBean.novoAgendamento.dataHoraInicio}" 
                                  showTime="true" pattern="dd/MM/yyyy HH:mm" required="true" style="width:100%;" />

                    <p:outputLabel for="duracao" value="Duração (Horas):" />
                    <p:inputNumber id="duracao" value="#{agendamentoBean.novoAgendamento.duracaoHoras}" 
                                   minValue="0.5" decimalPlaces="1" required="true" style="width:100%;">
                        <p:ajax event="blur" listener="#{agendamentoBean.calcularCustoTotal}" update="txtCusto" />
                    </p:inputNumber>

                    <p:outputLabel for="tipo" value="Tipo de Reunião:" />
                    <p:selectOneMenu id="tipo" value="#{agendamentoBean.novoAgendamento.tipo}" style="width:100%;">
                        <f:selectItems value="#{agendamentoBean.tiposReuniao}" var="t" itemLabel="#{t.descricao}" itemValue="#{t}" />
                    </p:selectOneMenu>

                    <p:outputLabel value="Custo Estimado:" />
                    <h:outputText id="txtCusto" value="#{agendamentoBean.novoAgendamento.custoTotal}" style="font-weight:bold; color:green; font-size: 1.1em;">
                        <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR" />
                    </h:outputText>

                </h:panelGrid>

                <div style="text-align: right; margin-top: 15px;">
                    <p:commandButton value="Salvar" icon="pi pi-check" 
                                     actionListener="#{agendamentoBean.salvar}" 
                                     update=":formAgendamento:dtAgendamentos :formAgendamento:messages pgNovo" 
                                     oncomplete="if (!args.validationFailed) PF('dlgNovo').hide()" />
                    <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('dlgNovo').hide()" 
                                     type="button" styleClass="ui-button-flat" style="margin-left:5px;" />
                </div>
            </h:form>
        </p:dialog>

    </h:body>
</html>
