<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Login - ProjectCalcCorp</title>
</h:head>
<h:body style="background-color: #f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <h:form id="formLogin">
        <p:panel header="Acesso ao Sistema" style="width: 350px;">
            <p:messages id="messages">
                <p:autoUpdate />
            </p:messages>

            <h:panelGrid columns="1" style="width:100%;">
                <p:outputLabel for="usr" value="Usuário:" />
                <p:inputText id="usr" value="#{loginBean.usuario}" required="true" requiredMessage="Digite o usuário." style="width:100%; margin-bottom: 10px;"/>

                <p:outputLabel for="pwd" value="Senha:" />
                <p:password id="pwd" value="#{loginBean.senha}" required="true" requiredMessage="Digite a senha." style="width:100%; margin-bottom: 10px;"/>

                <p:commandButton value="Entrar" action="#{loginBean.autenticar}" update="@form" style="width:100%; margin-top:10px;"/>
            </h:panelGrid>
        </p:panel>
    </h:form>
</h:body>
</html>
